<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    nav { position: fixed; top: 0; width: 100%; background: #111; padding: 1rem; }
    nav a { color: #fff; margin-right: 1rem; text-decoration: none; }
    section { min-height: 100vh; padding: 6rem 2rem 2rem; }
    #home { background: #f4f4f4; }
    #about { background: #e8eef7; }
    #contact { background: #f4f4f4; }
  </style>
</head>
<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
  <section id="home"><h1>Hello</h1><p>Welcome to my page.</p></section>
  <section id="about"><h2>About</h2><p>Something about me.</p></section>
  <section id="contact"><h2>Contact</h2><p>me@example.com</p></section>
</body>
</html>
